version: '8.0'

app:
    name: 'ChemDoc'
    version: '1.0.0'
    charset: 'utf8mb4'
    timezone: 'Asia/Shanghai'

debug:
    enabled: true
    level: 0

db:
    type: 'mysql'
    hostname: '127.0.0.1'
    database: 'chemdoc'
    username: 'root'
    password: 'root'
    hostport: '3306'
    charset: 'utf8mb4'
    prefix: ''
    debug: true
    deploy: 0
    rw_separate: false
    break_reconnect: false
    trigger_sql: true
    fields_strict: true
    resultset_type: 'array'
    auto_timestamp: false
    datetime_format: 'Y-m-d H:i:s'
    sql_explain: false

session:
    type: ''
    expire: 86400
    prefix: 'chemdoc_'
    auto_start: true

redis:
    host: '127.0.0.1'
    port: 6379
    password: ''
    select: 0
    timeout: 0
    expire: 0
    persistent: false
    prefix: 'chemdoc_'

lang:
    detecting: ['zh-cn']
    default_lang_set: 'zh-cn'

middleware:
    auth:
        enabled: true
        exclude: ['login', 'register']
    cors:
        enabled: true
        origin: '*'
        methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        headers: ['Content-Type', 'Authorization']

pagination:
    list_rows: 20
    var_page: 'page'
    path: '/'

upload:
    path: 'uploads'
    max_size: 10485760
    allowed_ext: ['jpg', 'jpeg', 'png', 'gif', 'pdf', 'doc', 'docx', 'xls', 'xlsx']
