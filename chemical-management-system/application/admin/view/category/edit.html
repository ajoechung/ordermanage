{extend name="public/layout" /}
{block name="content-header"}
<div class="row mb-2">
    <div class="col-sm-6">
        <h1 class="m-0">编辑分类</h1>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{:url('admin/index/index')}">首页</a></li>
            <li class="breadcrumb-item"><a href="{:url('index')}">产品分类</a></li>
            <li class="breadcrumb-item active">编辑分类</li>
        </ol>
    </div>
</div>
{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">分类信息</h3>
    </div>
    <div class="card-body">
        <form id="form" method="POST" class="form-horizontal">
            <input type="hidden" name="id" value="{$info.id}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">上级分类</label>
                <div class="col-sm-4">
                    <select name="parent_id" class="form-control">
                        <option value="0">顶级分类</option>
                        {volist name="categories" id="cat"}
                        {if condition="$info.id != $cat.id"}
                        <option value="{$cat.id}" {if condition="$info.parent_id == $cat.id"}selected{/if}>{:str_repeat('├─ ', $cat.level)}{$cat.name}</option>
                        {/if}
                        {/volist}
                    </select>
                </div>
                <label class="col-sm-2 col-form-label">分类名称 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="name" class="form-control" value="{$info.name}" required>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-4">
                    <input type="number" name="sort" class="form-control" value="{$info.sort}">
                </div>
                <label class="col-sm-2 col-form-label">是否显示</label>
                <div class="col-sm-4">
                    <select name="is_show" class="form-control">
                        <option value="1" {if condition="$info.is_show == 1"}selected{/if}>显示</option>
                        <option value="0" {if condition="$info.is_show == 0"}selected{/if}>隐藏</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <a href="{:url('index')}" class="btn btn-default ml-2">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
$(function() {
    $('#form').on('submit', function(e) {
        e.preventDefault();
        $.post('{:url("edit")}', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert(res.msg);
                window.location.href = res.url;
            } else {
                alert(res.msg);
            }
        }, 'json');
    });
});
</script>
{/block}
