{extend name="public/layout" /}
{block name="content-header"}
<div class="row mb-2">
    <div class="col-sm-6">
        <h1 class="m-0">编辑采购单</h1>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{:url('admin/index/index')}">首页</a></li>
            <li class="breadcrumb-item"><a href="{:url('index')}">采购单管理</a></li>
            <li class="breadcrumb-item active">编辑采购单</li>
        </ol>
    </div>
</div>
{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">采购单信息</h3>
    </div>
    <div class="card-body">
        <form id="form" method="POST" class="form-horizontal">
            <input type="hidden" name="id" value="{$info.id}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">采购单号 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="purchase_no" class="form-control" value="{$info.purchase_no}" required>
                </div>
                <label class="col-sm-2 col-form-label">供应商 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <select name="supplier_id" class="form-control" required>
                        <option value="">请选择供应商</option>
                        {volist name="suppliers" id="supplier"}
                        <option value="{$supplier.id}" {if condition="$info.supplier_id == $supplier.id"}selected{/if}>{$supplier.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">金额 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="number" name="amount" class="form-control" step="0.01" value="{$info.amount}" required>
                </div>
                <label class="col-sm-2 col-form-label">下单时间 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="datetime-local" name="purchase_time" class="form-control" value="{:substr($info.purchase_time, 0, 16)}" required>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">履约状态</label>
                <div class="col-sm-4">
                    <select name="fulfill_status" class="form-control">
                        <option value="1" {if condition="$info.fulfill_status == 1"}selected{/if}>待确认</option>
                        <option value="2" {if condition="$info.fulfill_status == 2"}selected{/if}>已确认</option>
                        <option value="3" {if condition="$info.fulfill_status == 3"}selected{/if}>采购中</option>
                        <option value="4" {if condition="$info.fulfill_status == 4"}selected{/if}>已到货</option>
                        <option value="5" {if condition="$info.fulfill_status == 5"}selected{/if}>已完成</option>
                        <option value="6" {if condition="$info.fulfill_status == 6"}selected{/if}>已取消</option>
                    </select>
                </div>
                <label class="col-sm-2 col-form-label">发票状态</label>
                <div class="col-sm-4">
                    <select name="invoice_status" class="form-control">
                        <option value="1" {if condition="$info.invoice_status == 1"}selected{/if}>未开</option>
                        <option value="2" {if condition="$info.invoice_status == 2"}selected{/if}>已申请</option>
                        <option value="3" {if condition="$info.invoice_status == 3"}selected{/if}>已开具</option>
                        <option value="4" {if condition="$info.invoice_status == 4"}selected{/if}>已寄出</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">关联订单</label>
                <div class="col-sm-4">
                    <input type="text" name="order_id" class="form-control" value="{$info.order_id|default=''}">
                </div>
                <label class="col-sm-2 col-form-label">发票附件</label>
                <div class="col-sm-4">
                    <input type="text" name="invoice_file" class="form-control" value="{$info.invoice_file|default=''}">
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-10">
                    <textarea name="remark" class="form-control" rows="3">{$info.remark|default=''}</textarea>
                </div>
            </div>
            
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <a href="{:url('index')}" class="btn btn-default ml-2">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
$(function() {
    $('#form').on('submit', function(e) {
        e.preventDefault();
        $.post('{:url("edit")}', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert(res.msg);
                window.location.href = res.url;
            } else {
                alert(res.msg);
            }
        }, 'json');
    });
});
</script>
{/block}
