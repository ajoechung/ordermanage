{extend name="public/layout" /}
{block name="content-header"}
<div class="row mb-2">
    <div class="col-sm-6">
        <h1 class="m-0">编辑供应商</h1>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{:url('admin/index/index')}">首页</a></li>
            <li class="breadcrumb-item"><a href="{:url('index')}">供应商管理</a></li>
            <li class="breadcrumb-item active">编辑供应商</li>
        </ol>
    </div>
</div>
{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">供应商信息</h3>
    </div>
    <div class="card-body">
        <form id="form" method="POST" class="form-horizontal">
            <input type="hidden" name="id" value="{$info.id}">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">供应商名称 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="name" class="form-control" value="{$info.name}" required>
                </div>
                <label class="col-sm-2 col-form-label">联系人</label>
                <div class="col-sm-4">
                    <input type="text" name="contact" class="form-control" value="{$info.contact}">
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">联系电话</label>
                <div class="col-sm-4">
                    <input type="text" name="phone" class="form-control" value="{$info.phone}">
                </div>
                <label class="col-sm-2 col-form-label">负责人</label>
                <div class="col-sm-4">
                    <select name="user_id" class="form-control">
                        <option value="">请选择</option>
                        {volist name="users" id="user"}
                        <option value="{$user.id}" {if condition="$info.user_id == $user.id"}selected{/if}>{$user.realname}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">地址</label>
                <div class="col-sm-10">
                    <input type="text" name="address" class="form-control" value="{$info.address}">
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">描述</label>
                <div class="col-sm-10">
                    <textarea name="description" class="form-control" rows="3">{$info.description}</textarea>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-4">
                    <select name="status" class="form-control">
                        <option value="1" {if condition="$info.status == 1"}selected{/if}>正常</option>
                        <option value="2" {if condition="$info.status == 2"}selected{/if}>合作中</option>
                        <option value="3" {if condition="$info.status == 3"}selected{/if}>已终止</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <a href="{:url('index')}" class="btn btn-default ml-2">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
$(function() {
    $('#form').on('submit', function(e) {
        e.preventDefault();
        $.post('{:url("edit")}', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert(res.msg);
                window.location.href = res.url;
            } else {
                alert(res.msg);
            }
        }, 'json');
    });
});
</script>
{/block}
