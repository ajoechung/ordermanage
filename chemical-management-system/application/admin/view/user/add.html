{extend name="public/layout" /}
{block name="content-header"}
<div class="row mb-2">
    <div class="col-sm-6">
        <h1 class="m-0">新增用户</h1>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{:url('admin/index/index')}">首页</a></li>
            <li class="breadcrumb-item"><a href="{:url('index')}">用户管理</a></li>
            <li class="breadcrumb-item active">新增用户</li>
        </ol>
    </div>
</div>
{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">用户信息</h3>
    </div>
    <div class="card-body">
        <form id="form" method="POST" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">用户名 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="username" class="form-control" required>
                </div>
                <label class="col-sm-2 col-form-label">真实姓名 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="realname" class="form-control" required>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">密码 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <label class="col-sm-2 col-form-label">角色 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <select name="role_id" class="form-control" required>
                        <option value="">请选择角色</option>
                        {volist name="roles" id="role"}
                        <option value="{$role.id}">{$role.role_name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">手机号码</label>
                <div class="col-sm-4">
                    <input type="text" name="phone" class="form-control">
                </div>
                <label class="col-sm-2 col-form-label">邮箱</label>
                <div class="col-sm-4">
                    <input type="email" name="email" class="form-control">
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-4">
                    <select name="status" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <a href="{:url('index')}" class="btn btn-default ml-2">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
$(function() {
    $('#form').on('submit', function(e) {
        e.preventDefault();
        $.post('{:url("add")}', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert(res.msg);
                window.location.href = res.url;
            } else {
                alert(res.msg);
            }
        }, 'json');
    });
});
</script>
{/block}
