{extend name="public/layout" /}
{block name="content-header"}
<div class="row mb-2">
    <div class="col-sm-6">
        <h1 class="m-0">新增产品</h1>
    </div>
    <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a href="{:url('admin/index/index')}">首页</a></li>
            <li class="breadcrumb-item"><a href="{:url('index')}">产品信息</a></li>
            <li class="breadcrumb-item active">新增产品</li>
        </ol>
    </div>
</div>
{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">产品信息</h3>
    </div>
    <div class="card-body">
        <form id="form" method="POST" class="form-horizontal">
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">产品名称 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <input type="text" name="name" class="form-control" required>
                </div>
                <label class="col-sm-2 col-form-label">所属分类 <span class="text-danger">*</span></label>
                <div class="col-sm-4">
                    <select name="category_id" class="form-control" required>
                        <option value="">请选择分类</option>
                        {volist name="categories" id="cat"}
                        <option value="{$cat.id}">{:str_repeat('├─ ', $cat.level)}{$cat.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">规格</label>
                <div class="col-sm-4">
                    <input type="text" name="spec" class="form-control" placeholder="如：500ml/瓶">
                </div>
                <label class="col-sm-2 col-form-label">单价</label>
                <div class="col-sm-4">
                    <input type="number" name="price" class="form-control" step="0.01" placeholder="0.00">
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">产品描述</label>
                <div class="col-sm-10">
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
            </div>
            
            <div class="form-group row">
                <label class="col-sm-2 col-form-label">状态</label>
                <div class="col-sm-4">
                    <select name="status" class="form-control">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <a href="{:url('index')}" class="btn btn-default ml-2">
                        <i class="fas fa-arrow-left"></i> 返回
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
$(function() {
    $('#form').on('submit', function(e) {
        e.preventDefault();
        $.post('{:url("add")}', $(this).serialize(), function(res) {
            if (res.code === 1) {
                alert(res.msg);
                window.location.href = res.url;
            } else {
                alert(res.msg);
            }
        }, 'json');
    });
});
</script>
{/block}
