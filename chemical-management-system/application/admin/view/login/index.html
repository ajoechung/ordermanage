<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 化工单据管理系统</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="__ADMIN__/css/login.css">
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="#"><i class="fas fa-flask"></i> <strong>化工单据管理系统</strong></a>
        </div>
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">请登录您的账号</p>
                
                <form id="loginForm" method="POST">
                    <div class="input-group mb-3">
                        <input type="text" name="username" class="form-control" placeholder="用户名" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" name="password" class="form-control" placeholder="密码" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-sign-in-alt mr-2"></i>登录
                            </button>
                        </div>
                    </div>
                </form>
                
                <div class="mt-3 text-center">
                    <p class="text-muted">默认账号：admin / admin</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <script>
    $(function() {
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            $.post('{:url("login/login")}', $(this).serialize(), function(res) {
                if (res.code === 1) {
                    alert(res.msg);
                    window.location.href = res.url;
                } else {
                    alert(res.msg);
                }
            }, 'json');
        });
    });
    </script>
</body>
</html>
